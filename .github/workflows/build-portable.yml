name: Build Caprine PortableApps (source to Releases)

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Blank = latest non-prerelease stable GitHub release; or X.Y.Z'
        type: string
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild even when this builder release tag exists (publisher will reject conflicting content)'
        type: boolean
        default: false
      engine:
        description: 'Shared packager engine; official is experimental and requires trusted installer URL and SHA256'
        type: choice
        options:
          - custom-nsis
          - official
        default: custom-nsis
      official_tool_url:
        description: 'Only for official engine: authentic official packager HTTPS URL'
        type: string
        default: ''
      official_tool_sha256:
        description: 'Only for official engine: authenticated SHA256'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: caprine-portable-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_REBUILD: ${{ inputs.force_rebuild }}
      OFFICIAL_URL: ${{ inputs.official_tool_url }}
      OFFICIAL_SHA: ${{ inputs.official_tool_sha256 }}
    steps:
      - name: Checkout independent builder only
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify pinned shared-action contracts and resolved commits
        run: |
          & ./scripts/verify-integrations.ps1
      - name: Fast builder source-kit tests
        run: |
          & python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Builder source-kit static tests failed' }
      - name: Windows regression test for GitHub release enumeration
        run: |
          & ./scripts/test-release-selection.ps1
      - name: Validate experimental packager request
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          if ($env:ENGINE -eq 'official') {
            if ($env:OFFICIAL_URL -notmatch '^https://') { throw 'Official engine requires HTTPS URL' }
            if ($env:OFFICIAL_SHA -notmatch '^[0-9a-fA-F]{64}$') { throw 'Official engine requires verified SHA256' }
          }
      - name: Resolve eligible stable upstream and skip unchanged release
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.upstream_version }}
        run: |
          & ./scripts/resolve.ps1 -Version $env:REQUESTED_VERSION -ForceBuild:($env:FORCE_REBUILD -eq 'true')
      - name: Node.js 24
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: .NET 9 SDK for compiled NativeAOT launcher
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Use pinned release tag and compile real Caprine and launcher
        if: steps.resolve.outputs.skip != 'true'
        run: |
          & ./scripts/build.ps1 -Tag '${{ steps.resolve.outputs.upstream_tag }}' -Version '${{ steps.resolve.outputs.version }}'
      - name: Exercise compiled TraceGuard and validate staging
        if: steps.resolve.outputs.skip != 'true'
        run: |
          & ./scripts/validate-stage.ps1 -Stage './work/staging/CaprinePortable'
      - name: Independently build and verify ready-to-extract ZIP
        if: steps.resolve.outputs.skip != 'true'
        run: |
          & python ./scripts/package-zip.py --stage ./work/staging/CaprinePortable --out ./dist --revision r3
          if ($LASTEXITCODE -ne 0) { throw 'Independent ZIP build failed' }
      - name: Shared Universal Portable Package Builder v1.0.0
        id: pkg
        if: steps.resolve.outputs.skip != 'true'
        continue-on-error: true
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: work/staging/CaprinePortable
          output-dir: dist
          engine: ${{ inputs.engine }}
          running-exe: App\Caprine\Caprine.exe
          package-revision: r3
          timeout-seconds: '900'
          official-tool-url: ${{ inputs.official_tool_url }}
          official-tool-sha256: ${{ inputs.official_tool_sha256 }}
      - name: Verify reported installer provenance, real installation, and Data-preserving upgrade
        if: steps.resolve.outputs.skip != 'true' && steps.pkg.outcome == 'success'
        env:
          INSTALLER_PATH: ${{ steps.pkg.outputs.installer-file }}
        run: |
          if (-not $env:INSTALLER_PATH) { throw 'Shared packager returned no installer-file output' }
          & ./scripts/verify-installer.ps1 -Installer $env:INSTALLER_PATH -Stage ./work/staging/CaprinePortable
      - name: Shared Release Publisher dry run (validated ZIP and installer)
        if: steps.resolve.outputs.skip != 'true' && steps.pkg.outcome == 'success'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ steps.resolve.outputs.release_tag }}
          release-title: Caprine Portable ${{ steps.resolve.outputs.version }} (r3)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish complete verified release (ZIP and installer)
        if: steps.resolve.outputs.skip != 'true' && steps.pkg.outcome == 'success'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ steps.resolve.outputs.release_tag }}
          release-title: Caprine Portable ${{ steps.resolve.outputs.version }} (r3)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Preview verified ZIP-only fallback when shared packaging fails
        if: steps.resolve.outputs.skip != 'true' && steps.pkg.outcome == 'failure'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: dist/*.zip
          tag: ${{ steps.resolve.outputs.release_tag }}-ziponly
          release-title: Caprine Portable ZIP only (installer build FAILED)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Preserve validated ZIP-only release when packaging fails
        if: steps.resolve.outputs.skip != 'true' && steps.pkg.outcome == 'failure'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: dist/*.zip
          tag: ${{ steps.resolve.outputs.release_tag }}-ziponly
          release-title: Caprine Portable ZIP only (installer build FAILED)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
      - name: Report the mandatory installer failure correctly
        if: steps.resolve.outputs.skip != 'true' && steps.pkg.outcome == 'failure'
        run: throw 'Shared installer generation failed. The separately validated ZIP was published with a ziponly tag; this workflow is correctly FAILED.'
      - name: No-op when publisher-managed release already exists
        if: steps.resolve.outputs.skip == 'true'
        run: Write-Host 'Existing release detected; no expensive compilation, packaging or upload was performed.'
