name: Package only (verified existing ZIP, no compilation)

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: 'Exact prior release tag containing verified CaprinePortable ZIP + SHA256SUMS.txt'
        type: string
        required: true
      package_revision:
        description: 'New package revision; e.g. r5 for an r4-r4 source (must not conflict with existing release)'
        type: string
        required: true
        default: r5
      engine:
        type: choice
        options:
          - custom-nsis
          - official
        default: custom-nsis
      official_tool_url:
        type: string
        default: ''
      official_tool_sha256:
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: caprine-package-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repackage:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_URL: ${{ inputs.official_tool_url }}
      OFFICIAL_SHA: ${{ inputs.official_tool_sha256 }}
      PKG_REV: ${{ inputs.package_revision }}
      SOURCE_RELEASE: ${{ inputs.source_release_tag }}
      ENGINE: ${{ inputs.engine }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify pinned shared-action contracts and resolved commits
        run: |
          & ./scripts/verify-integrations.ps1
      - name: Validate packaging request and verify trusted ZIP
        id: prep
        run: |
          if ($env:PKG_REV -notmatch '^r[0-9]+$') { throw 'package_revision must be r2, r3, etc.' }
          if ($env:ENGINE -eq 'official') {
            if ($env:OFFICIAL_URL -notmatch '^https://' -or $env:OFFICIAL_SHA -notmatch '^[0-9a-fA-F]{64}$') {
              throw 'Official experiment requires trusted HTTPS URL + SHA256'
            }
          }
          & ./scripts/prepare-repackage.ps1 -SourceRelease $env:SOURCE_RELEASE
      - name: Build installer using only pinned shared packager
        id: pkg
        uses: vhick/Portable-Package-Builder@v1.0.0
        with:
          source-dir: work/restored/CaprinePortable
          output-dir: dist
          engine: ${{ inputs.engine }}
          running-exe: App\Caprine\Caprine.exe
          package-revision: ${{ inputs.package_revision }}
          official-tool-url: ${{ inputs.official_tool_url }}
          official-tool-sha256: ${{ inputs.official_tool_sha256 }}
      - name: Verify installer and real upgrade without resetting Data
        env:
          INSTALLER_PATH: ${{ steps.pkg.outputs.installer-file }}
        run: |
          & ./scripts/verify-installer.ps1 -Installer $env:INSTALLER_PATH -Stage ./work/restored/CaprinePortable
      - name: Publisher dry run
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: portable-v${{ steps.prep.outputs.version }}-${{ steps.prep.outputs.builder_revision }}-${{ inputs.package_revision }}
          release-title: Caprine Portable ${{ steps.prep.outputs.version }} (${{ inputs.package_revision }} packaging-only)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'
      - name: Publish verified ZIP and new shared installer
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: portable-v${{ steps.prep.outputs.version }}-${{ steps.prep.outputs.builder_revision }}-${{ inputs.package_revision }}
          release-title: Caprine Portable ${{ steps.prep.outputs.version }} (${{ inputs.package_revision }} packaging-only)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
